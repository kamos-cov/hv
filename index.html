<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building K012 – Raumbuchungen</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #333; }

    header {
      background: #009fe4;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.3rem; }
    header span { font-size: 0.9rem; opacity: 0.85; }

    .toolbar {
      background: white;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #e0e0e0;
      flex-wrap: wrap;
    }
    .toolbar label { font-weight: bold; font-size: 0.9rem; }
    .toolbar input[type="date"] {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .toolbar button {
      padding: 7px 18px;
      background: #009fe4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .toolbar button:hover { background: #007bbf; }
    .toolbar button.secondary {
      background: white;
      color: #009fe4;
      border: 1px solid #009fe4;
    }
    .toolbar button.secondary:hover { background: #e8f5fd; }

    #status {
      padding: 10px 24px;
      font-size: 0.85rem;
      color: #666;
      min-height: 32px;
    }
    #status.error { color: #c0392b; }
    #status.success { color: #27ae60; }

    #chart-container {
      padding: 16px 24px;
      background: white;
      margin: 16px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      min-height: 400px;
    }

    .legend-info {
      margin: 0 24px 16px;
      font-size: 0.8rem;
      color: #888;
    }

    .login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
    }
    .login-screen p { color: #666; }
    .login-screen button {
      padding: 12px 32px;
      background: #009fe4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>🏢 Building K012 – Raumbuchungen (5. OG)</h1>
  <span id="user-info"></span>
</header>

<div id="app">
  <div class="login-screen" id="login-screen">
    <p>Bitte melde dich mit deinem Covestro-Account an.</p>
    <button onclick="signIn()">🔐 Mit Microsoft anmelden</button>
  </div>

  <div id="main-content" style="display:none">
    <div class="toolbar">
      <label for="datePicker">📅 Datum:</label>
      <input type="date" id="datePicker">
      <button onclick="loadBookings()">🔄 Laden</button>
      <button class="secondary" onclick="goToday()">Heute</button>
      <button class="secondary" onclick="changeDay(-1)">◀ Vorheriger Tag</button>
      <button class="secondary" onclick="changeDay(1)">Nächster Tag ▶</button>
    </div>

    <div id="status"></div>
    <div id="chart-container">
      <div id="vega-chart"></div>
    </div>
    <div class="legend-info">Hover über einen Balken für Details · Zeitbereich: 06:00–22:00 Uhr</div>
  </div>
</div>

<script>
// ============================================================
// KONFIGURATION – hier anpassen!
// ============================================================
const CONFIG = {
  clientId: "01c79863-1144-49d0-8bd4-59c8692b7391",           // App Registration Client ID
  tenantId: "0468bc4a-134c-4fb0-b843-a2a3d583e919",            // z.B. covestro.com oder GUID
  rooms: [
    { email: "RES_13900@covestro.com",  name: "Raum 0501" },
    { email: "RES_14172@covestro.com",  name: "Raum 0502" },
    { email: "RES_14171@covestro.com",  name: "Raum 0509" },
    { email: "RES_14175@covestro.com",  name: "Raum 0510" },
    { email: "RES_13844@covestro.com",  name: "Raum 0521" },
    { email: "RES_14173@covestro.com",  name: "Raum 0522" },
    { email: "RES_14174@covestro.com",  name: "Raum 0530" },
    { email: "RES_14128@covestro.com",  name: "Raum 0550" },
    { email: "RES_14170@covestro.com",  name: "Raum 0572" },
  ]
};

// ============================================================
// MSAL```html
// ============================================================
const msalConfig = {
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: window.location.href.split('?')[0]
  },
  cache: { cacheLocation: "sessionStorage" }
};

const msalInstance = new msal.PublicClientApplication(msalConfig);
const scopes = ["Calendars.Read", "Calendars.Read.Shared"];

let currentAccount = null;

async function signIn() {
  try {
    const response = await msalInstance.loginPopup({ scopes });
    currentAccount = response.account;
    document.getElementById("user-info").textContent = `👤 ${currentAccount.name}`;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("main-content").style.display = "block";
    goToday();
  } catch (e) {
    setStatus("Anmeldung fehlgeschlagen: " + e.message, "error");
  }
}

async function getToken() {
  try {
    const response = await msalInstance.acquireTokenSilent({ scopes, account: currentAccount });
    return response.accessToken;
  } catch {
    const response = await msalInstance.acquireTokenPopup({ scopes });
    return response.accessToken;
  }
}

// ============================================================
// DATUM HELPERS
// ============================================================
function goToday() {
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("datePicker").value = today;
  loadBookings();
}

function changeDay(delta) {
  const picker = document.getElementById("datePicker");
  const d = new Date(picker.value);
  d.setDate(d.getDate() + delta);
  picker.value = d.toISOString().split("T")[0];
  loadBookings();
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString("de-DE", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

// ============================================================
// GRAPH API – Raum-Kalender abrufen
// ============================================================
async function fetchRoomEvents(token, roomEmail, dateStr) {
  const start = `${dateStr}T06:00:00`;
  const end   = `${dateStr}T22:00:00`;
  const url = `https://graph.microsoft.com/v1.0/users/${encodeURIComponent(roomEmail)}/calendar/calendarView`
            + `?startDateTime=${start}&endDateTime=${end}`
            + `&$select=subject,start,end,organizer`
            + `&$top=50`;

  const resp = await fetch(url, {
    headers: { Authorization: `Bearer ${token}` }
  });

  if (!resp.ok) {
    console.warn(`Fehler bei ${roomEmail}: ${resp.status}`);
    return [];
  }
  const data = await resp.json();
  return data.value || [];
}

// ============================================================
// BUCHUNGEN LADEN & CHART RENDERN
// ============================================================
async function loadBookings() {
  const dateStr = document.getElementById("datePicker").value;
  if (!dateStr) return;

  setStatus("⏳ Lade Buchungen...");

  try {
    const token = await getToken();
    const allEvents = [];

    // Alle Räume parallel abfragen
    await Promise.all(CONFIG.rooms.map(async (room) => {
      const events = await fetchRoomEvents(token, room.email, dateStr);
      events.forEach(ev => {
        const startH = timeToHours(ev.start.dateTime);
        const endH   = timeToHours(ev.end.dateTime);
        allEvents.push({
          room:      room.name,
          subject:   ev.subject || "(kein Titel)",
          organizer: ev.organizer?.emailAddress?.name || ev.organizer?.emailAddress?.address || "–",
          start:     startH,
          end:       endH,
          startLabel: hoursToTime(startH),
          endLabel:   hoursToTime(endH)
        });
      });
    }));

    if (allEvents.length === 0) {
      setStatus(`✅ Keine Buchungen am ${formatDateLabel(dateStr)} gefunden.`, "success");
      document.getElementById("vega-chart").innerHTML =
        `<p style="text-align:center;padding:60px;color:#aaa;font-size:1.1rem;">Keine Buchungen für diesen Tag.</p>`;
      return;
    }

    setStatus(`✅ ${allEvents.length} Buchung(en) geladen für ${formatDateLabel(dateStr)}.`, "success");
    renderChart(allEvents, dateStr);

  } catch (e) {
    setStatus("❌ Fehler beim Laden: " + e.message, "error");
    console.error(e);
  }
}

function timeToHours(isoString) {
  // Graph gibt UTC zurück – in Berlin-Zeit umrechnen
  const d = new Date(isoString);
  return d.getHours() + d.getMinutes() / 60;
}

function hoursToTime(h) {
  const hh = Math.floor(h).toString().padStart(2, "0");
  const mm = Math.round((h % 1) * 60).toString().padStart(2, "0");
  return `${hh}:${mm}`;
}

// ============================================================
// VEGA-LITE CHART
// ============================================================
function renderChart(data, dateStr) {
  const roomOrder = CONFIG.rooms.map(r => r.name);

  const spec = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "title": {
      "text": `Building K012 – Raumbuchungen – ${formatDateLabel(dateStr)}`,
      "fontSize": 15,
      "font": "Arial"
    },
    "width": "container",
    "height": 420,
    "data": { "values": data },
    "mark": { "type": "bar", "cornerRadius": 3, "height": { "band": 0.75 } },
    "encoding": {
      "y": {
        "field": "room",
        "type": "nominal",
        "sort": roomOrder,
        "axis": { "title": "Raum", "labelFontSize": 12, "titleFontSize": 13 }
      },
      "x": {
        "field": "start",
        "type": "quantitative",
        "scale": { "domain": [6, 22] },
        "axis": {
          "title": "Uhrzeit",
          "tickCount": 17,
          "labelFontSize": 11,
          "titleFontSize": 13,
          "labelExpr": "datum.value % 1 === 0 ? datum.value + ':00' : ''"
        }
      },
      "x2": { "field": "end" },
      "color": {
        "field": "room",
        "type": "nominal",
        "scale": {
          "domain": roomOrder,
          "range": ["#009fe4","#00bb7e","#e6007c","#7d55c7","#ff7f41","#ffee00","#333333","#00a0af","#a0c840"]
        },
        "legend": { "title": "Raum", "orient": "right", "labelFontSize": 11 }
      },
      "tooltip": [
        { "field": "room",       "type": "nominal",      "title": "Raum" },
        { "field": "subject",    "type": "nominal",      "title": "Besprechung" },
        { "field": "organizer",  "type": "nominal",      "title": "Organis```html
ator" },
        { "field": "startLabel", "type": "nominal",      "title": "Start" },
        { "field": "endLabel",   "type": "nominal",      "title": "Ende" }
      ]
    },
    "config": {
      "view": { "stroke": "#e0e0e0" },
      "axis": { "grid": true, "gridColor": "#f0f0f0" },
      "background": "#ffffff"
    }
  };

  vegaEmbed("#vega-chart", spec, { renderer: "svg", actions: false })
    .catch(err => setStatus("Chart-Fehler: " + err.message, "error"));
}

// ============================================================
// STATUS
// ============================================================
function setStatus(msg, type = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = type;
}

// MSAL Redirect handling beim Seitenload
msalInstance.handleRedirectPromise().then(response => {
  if (response) {
    currentAccount = response.account;
    document.getElementById("user-info").textContent = `👤 ${currentAccount.name}`;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("main-content").style.display = "block";
    goToday();
  }
});
</script>
</body>
</html>
